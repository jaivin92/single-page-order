<app-topbar></app-topbar>


<div class="main-wrap">

  <main class="catalog">

    <div class="search-container">

      <input #searchBox type="text" class="form-control" placeholder="Search product..." [value]="searchText"
        (input)="search(searchBox.value)">

    </div>


    <app-category-list [categories]="pos.categories" [activeCategory]="activeCategory"
      (categoryChange)="changeCategory($event)" />



    <app-product-catalog [products]="filteredProducts" (productClick)="addProduct($event)" />

  </main>


  <app-order-panel (checkout)="checkout()" (hold)="holdOrder()" (print)="openReceipt()" />

</div>


@if (showReceipt) {

<app-receipt (close)="closeReceipt()" />

}
